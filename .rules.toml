# rules config for this repo.
# Legacy shell/upstream surface (src-tauri, frontend) is reported but excluded
# from the CI bar while it is being retired. The engine + simd_optimised
# crates must pass with zero "problem" findings.

ignore = [
  "src-tauri",
  "src",
  "bench/compare-renders.sh",
]

# Stylistic only; the remaining rules still fail the build.
[severity]
# Contiguous-code is a readability metric; rustfmt does not enforce blank-line
# density and hand-spacing 300+ dense image-math blocks adds no value.
contiguous-code = "suggestion"
# EXIF datetime semantics (local-time zones, custom formats) need chrono;
# humantime has no local-time support.
rust-chrono = "allow"