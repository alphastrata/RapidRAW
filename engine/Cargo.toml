[package]
name = "engine"
edition = "2024"

[features]
default = ["json"]
json = ["dep:serde_json"]

[dev-dependencies]
divan = "0.1"

[lints.clippy]
pedantic = "warn"
perf = "deny"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
blake3 = "1.8.7"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4.45"
crc32fast = "1.5.3"
filetime = "0.2.29"
futures = "0.3.34"
fuzzy-matcher = "0.3.7"
glam = "0.34.1"
half = { version = "2.7.1", features = ["bytemuck"] }
hex = "0.4.3"
image = "0.25.10"
imageproc = "0.27.0"
imgref = "1.12.3"
kamadak-exif = "0.6.1"
libc = "0.2.191"
little_exif = "0.6.23"
log = "0.4.34"
lsdetect = "0.4.0"
memmap2 = "0.9.12"
mozjpeg-rs = "0.9.2"
nalgebra = "0.35.0"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic"] }
pollster = "1.0.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rawler = { path = "../vendor/rawler/rawler", version = "0.7.1" }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rgb = "0.8.53"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = "0.11.1"
simd_kernels = { version = "0.0.0", path = "../simd_optimised/kernels" }
sysinfo = "0.39.6"
tempfile = "3.27.0"
tokenizers = "0.23.2"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"
wgpu = "30"

[[bench]]
name = "pure_ops"
harness = false
