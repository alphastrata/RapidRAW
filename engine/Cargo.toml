[package]
name = "engine"
edition = "2024"
rust-version = "1.98"

[features]
default = []
tethering = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
blake3 = "1.8.7"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4.45"
crc32fast = "1.5.3"
filetime = "0.2.29"
fuzzy-matcher = "0.3.7"
glam = "0.34.1"
half = { version = "2.7.1", features = ["bytemuck"] }
hex = "0.4.3"
image = "0.25.10"
image_hasher = "3.1.1"
imageproc = "0.27.0"
imgref = "1.12.3"
kamadak-exif = "0.6.1"
libc = "0.2.191"
little_exif = "0.6.23"
log = "0.4.34"
memmap2 = "0.9.12"
mozjpeg-rs = "0.9.2"
nalgebra = "0.35.0"
ndarray = "0.16"
once_cell = "1.21.4"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic"] }
pollster = "1.0.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git", version = "0.7.1" }
rayon = "1.12.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rgb = "0.8.53"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
simd_kernels = { version = "0.0.0", path = "../simd_optimised/kernels" }
sysinfo = "0.39.6"
tauri = { version = "2.12", features = ["macos-private-api", "rustls-tls", "protocol-asset"] }
tempfile = "3.27.0"
tokenizers = "0.23.2"
tokio = { version = "1.54.1", features = ["full"] }
walkdir = "2.5.0"
wgpu = "30"
