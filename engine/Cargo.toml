[package]
name = "engine"
edition = "2024"
rust-version = "1.98"

[features]
default = []
tethering = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
blake3 = "1.8.7"
image = "0.25.10"
log = "0.4.34"
rayon = "1.12.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
