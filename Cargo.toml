[workspace]
members = ["app", "engine", "simd_optimised/kernels"]
exclude = ["vendor"]
resolver = "3"
[workspace.lints.clippy]
pedantic = "warn"
perf = "deny"

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "clipboard",
    "wgpu",
    "accesskit",
    "wayland",
    "x11",
] }
egui = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "monochrome_emoji_fonts",
] }
craft-ui = { path = "vendor/craft-libs/crates/ui" }

[patch.crates-io]
ecolor = { path = "vendor/egui/crates/ecolor" }
emath = { path = "vendor/egui/crates/emath" }
epaint = { path = "vendor/egui/crates/epaint" }
epaint_default_fonts = { path = "vendor/egui/crates/epaint_default_fonts" }
egui = { path = "vendor/egui/crates/egui" }
egui-winit = { path = "vendor/egui/crates/egui-winit" }
egui-wgpu = { path = "vendor/egui/crates/egui-wgpu" }
eframe = { path = "vendor/egui/crates/eframe" }
winit = { path = "vendor/winit" }

[profile.dev]
opt-level = 3
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true