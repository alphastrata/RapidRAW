[workspace]
members = ["engine", "src-tauri", "simd_optimised/kernels"]
resolver = "3"
[workspace.lints.clippy]
pedantic = "warn"
perf = "deny"

[profile.dev]
opt-level = 3
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
