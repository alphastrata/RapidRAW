[package]
name = "RapidRAW"
description = "A blazingly-fast, non-destructive, and GPU-accelerated RAW image editor built with performance in mind."
authors = ["Timon Käch"]
edition = "2024"

[lib]
name = "rapidraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

[dependencies]
tauri = { version = "2.12", features = [ "macos-private-api", "rustls-tls", "protocol-asset" ] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.10"
tiff = "0.11.3"
base64 = "0.23"
tauri-plugin-fs = "2.7.1"
rayon = "1.12.0"
blake3 = "1.8.7"
wgpu = "30.0"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0.104"
kamadak-exif = "0.6.1"
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
walkdir = "2.5.0"
imageproc = "0.27.0"
lsdetect = "0.4.0"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic"] }
ndarray = "0.16"
tauri-plugin-process = "2.4.0"
tauri-plugin-os = "2.4.0"
log = "0.4"
fern = "0.7"
little_exif = "0.6.23"
crc32fast = "1.5.3"
chrono = "0.4"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
once_cell = "1.21"
futures = "0.3.34"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
tauri-plugin-shell = "2.5.0"
tempfile = "3.27.0"
# no_thp: MADV_HUGEPAGE causes multi-second compaction stalls on fragmented Linux systems.
mimalloc = { version = "0.1.52", features = ["no_thp"] }
regex = "1.13.1"
memmap2 = "0.9.12"
half = { version = "2.7.1", features = ["bytemuck"] }
glam = "0.34.1"
quick-xml = { version = "0.42", features = ["serialize"] }
fuzzy-matcher = "0.3.7"
mozjpeg-rs = "0.9.2"
webp = "0.3"
jxl-oxide = { version = "0.12.6", features = ["image"] }
jxl-encoder = "0.3.4"
filetime = "0.2"
libc = "0.2.191"
rgb = "0.8.53"
imgref = "1.12.3"
sysinfo = "0.39.6"
tauri-plugin-store = "2.5.0"
simd_kernels = { path = "../simd_optimised/kernels" }
engine = { path = "../engine" }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
trash = "5.2.9"
tauri-plugin-single-instance = "2.5.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
    "NSData",
    "NSDictionary",
    "NSString",
    "NSURL",
    "NSValue",
    "NSArray",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace"] }
objc2-core-image = { version = "0.3.2", features = [
    "CIContext",
    "CIFilter",
    "CIImage",
    "CIRAWFilter",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "=2.0.2"
tauri-plugin-wayland-nvidia-quirk = "0.1.0"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[[bench]]
name = "image_ops"
harness = false

[[bench]]
name = "ai_ops"
harness = false

[[bench]]
name = "pipeline_ops"
harness = false


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
divan = "0.1.21"
